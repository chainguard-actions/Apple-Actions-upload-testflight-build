name: Test transporter backend inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy IPA file and fake transporter
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/app.ipa
          mkdir -p /tmp/fake-itms/bin
          cat > /tmp/fake-itms/bin/iTMSTransporter << 'EOF'
          #!/bin/bash
          echo "Fake iTMSTransporter called with: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-itms/bin/iTMSTransporter
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: TESTKEY123
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgtest
            -----END PRIVATE KEY-----
          backend: transporter
          transporter-executable-path: /tmp/fake-itms/bin/iTMSTransporter
          wait-for-processing: "false"
      - name: Assert action step executed
        run: |
          echo "PASS: action step with transporter backend executed (credentials are test placeholders)"
