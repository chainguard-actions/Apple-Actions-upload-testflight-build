name: Test macOS app type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy pkg file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy pkg content" > /tmp/testapp/app.pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.pkg
          app-type: macos
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with macos app-type and invalid credentials"
