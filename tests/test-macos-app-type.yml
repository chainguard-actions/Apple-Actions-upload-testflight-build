name: Test macOS app type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake PKG file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          echo "fake pkg content" > "$GITHUB_WORKSPACE/build/app.pkg"

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: "${{ github.workspace }}/build/app.pkg"
          app-type: macos
          issuer-id: "00000000-0000-0000-0000-000000000000"
          api-key-id: "AAAAAAAAAA"
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4GqnMeD9zKVmejFQAIoxnPmqShRANCAARna3oBnFDHqnkyjKKNhaB5HNU7NKJV
            2dkMDaFmkuKHQmjnCMHHBMDzHiHCGMHHBMDzHiHCGMHHBMDzHiHCGMHH
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action ran with macos app-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BACKEND" ]; then
              echo "FAIL: action succeeded but upload-backend output is empty"
              exit 1
            fi
            echo "PASS: upload-backend='$BACKEND'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials for macos app-type"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
