name: Test macOS app type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy PKG file
        run: |
          mkdir -p /tmp/test-app
          echo "dummy pkg content" > /tmp/test-app/MyApp.pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/test-app/MyApp.pkg
          app-type: macos
          issuer-id: 22222222-2222-2222-2222-222222222222
          api-key-id: TESTKEY002
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgdummykeyfortest
            -----END PRIVATE KEY-----

      - name: Assert action failed due to macOS requirement
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On Linux (act), the action must fail because it requires macOS.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome due to macOS requirement, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly reported failure on non-macOS platform with macos app-type"
