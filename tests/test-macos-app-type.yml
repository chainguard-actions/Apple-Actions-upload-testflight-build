name: Test macOS app type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy pkg file for macOS app upload
      - name: Create dummy macOS pkg file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy pkg content" > /tmp/testapp/MyMacApp.pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/MyMacApp.pkg
          app-type: macos
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action ran with macOS app type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not due to
          # an unrecognized app-type. We verify it did not succeed.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed when using macos app-type with invalid credentials"
