name: Test appstore-api backend rejects macOS app type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy pkg file
        run: touch /tmp/dummy.pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/dummy.pkg
          app-type: macos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: appstore-api

      - name: Assert action failed due to unsupported app type
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail because appstore-api does not support macOS app type"
            exit 1
          fi
          echo "PASS: action correctly rejected macOS app type for appstore-api backend"
