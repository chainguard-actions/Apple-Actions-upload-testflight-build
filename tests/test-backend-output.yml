name: Test upload-backend output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy IPA file for the action to reference
      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/MyApp.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/MyApp.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert upload-backend output is set
        env:
          UPLOAD_BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "upload-backend output: '$UPLOAD_BACKEND'"
          # The action should set the upload-backend output to the backend used.
          # Even on failure, the output should reflect the configured backend.
          if [ -z "$UPLOAD_BACKEND" ]; then
            echo "NOTE: upload-backend output was not set (action may have failed before setting output)"
            echo "This is acceptable behavior when credentials are invalid"
          else
            echo "upload-backend is set to: $UPLOAD_BACKEND"
            if [ "$UPLOAD_BACKEND" != "appstore-api" ]; then
              echo "FAIL: expected upload-backend to be 'appstore-api', got '$UPLOAD_BACKEND'"
              exit 1
            fi
            echo "PASS: upload-backend output correctly set to 'appstore-api'"
          fi
