name: Test upload-backend output behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/test-app
          echo "dummy ipa content" > /tmp/test-app/app.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/test-app/app.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqDmSfpQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQn
            QnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQn
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action failed (cannot upload with dummy IPA and invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a dummy IPA and invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with dummy IPA and invalid credentials"

      - name: Assert upload-backend output is not set when action fails
        env:
          UPLOAD_BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "upload-backend: '$UPLOAD_BACKEND'"
          # The upload-backend output is only set on successful upload.
          # With invalid credentials and a dummy IPA, the action fails before
          # setting the output, so it should be empty.
          if [ "$UPLOAD_BACKEND" = "appstore-api" ]; then
            echo "FAIL: upload-backend should not be set to 'appstore-api' when action failed"
            exit 1
          fi
          echo "PASS: upload-backend output is not set (empty or unset) when action fails"
