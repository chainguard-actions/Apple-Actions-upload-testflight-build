name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/test-app
          echo "dummy ipa content" > /tmp/test-app/app.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/test-app/app.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqDmSfpQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQn
            QnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQnQn
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action failed (not succeeded with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid credentials and a dummy IPA"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
