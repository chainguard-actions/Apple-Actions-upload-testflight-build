name: Test release-notes with macos app on appstore-api is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: does-not-exist.pkg
          app-type: macos
          issuer-id: dummy-issuer
          api-key-id: DUMMYKEY
          api-private-key: dummy-private-key
          backend: appstore-api
          release-notes: "Test release notes for this build"
          uses-non-exempt-encryption: "false"
      - name: Assert action failed without uploading
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for macos app on appstore-api backend"
            exit 1
          fi
          if [ -n "$BACKEND" ]; then
            echo "FAIL: upload-backend output should be empty"
            exit 1
          fi
          echo "PASS"
