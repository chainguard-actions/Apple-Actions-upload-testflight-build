name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/MyApp.ipa
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/MyApp.ipa
          app-type: ios
          issuer-id: 12345678-1234-1234-1234-123456789012
          api-key-id: ABCDEF1234
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqik3OqDmKFMZKQGBhqouhAKBggAEDEt7hSMnKqMoMoMoMoMoMoMoMoMoMo
            MoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMoMo
            -----END PRIVATE KEY-----
          release-notes: "Test release notes for CI build"
          transporter-executable-path: /usr/local/itms/bin/iTMSTransporter
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"
      - name: Assert action ran (output or error expected)
        env:
          BACKEND: ${{ steps.action.outputs.upload-backend }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          # The action is expected to fail since we have no real credentials,
          # but it must have run (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with expected outcome ($OUTCOME)"
