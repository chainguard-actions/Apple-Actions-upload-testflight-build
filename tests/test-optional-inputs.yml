name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy ipa file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/app.ipa
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.ipa
          app-type: ios
          issuer-id: fake-issuer-id-00000000-0000-0000-0000-000000000000
          api-key-id: FAKEKEYID1
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfakekey1234567890
            -----END PRIVATE KEY-----
          release-notes: "Test release notes for this build"
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"
      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with optional inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
