name: Test transporter-executable-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: '/tmp/fake.ipa'
          app-type: 'ios'
          issuer-id: 'fake-issuer-id'
          api-key-id: 'FAKEKEYID'
          api-private-key: 'fake-private-key'
          backend: 'transporter'
          transporter-executable-path: '/usr/local/itms/bin/iTMSTransporter'

      - name: Assert action failed (transporter requires macOS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using transporter on non-macOS"
            exit 1
          fi
          echo "PASS: action correctly failed (transporter backend requires macOS)"
