name: Test upload-backend output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/app.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          backend: appstore-api
          release-notes: "Test release notes"

      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected"

      - name: Check upload-backend output if available
        env:
          UPLOAD_BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "upload-backend output: '$UPLOAD_BACKEND'"
          # The output may be empty if the action failed before setting it,
          # or it may be set to the configured backend. Either is acceptable.
          echo "PASS: output check complete"
