name: Test basic upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/app.ipa
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: TESTKEY123
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgtest
            -----END PRIVATE KEY-----
          release-notes: Test release notes for CI
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"
      - name: Assert upload-backend output is set
        env:
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "upload-backend: $BACKEND"
          # The action may fail due to invalid credentials, but if it succeeds
          # the backend output should be set. We just verify the step ran.
          echo "PASS: action step executed (credentials are test placeholders)"
