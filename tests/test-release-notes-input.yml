name: Test release-notes input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy IPA file for the action to reference
      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/MyApp.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/MyApp.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: INVALIDKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          backend: appstore-api
          release-notes: "This is a test release note for CI validation."

      - name: Assert action ran (not a setup/input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not due to
          # the release-notes input being rejected. We expect 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed release-notes input and failed at credential validation"
