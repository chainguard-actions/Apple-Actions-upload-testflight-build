name: Test invalid upload-attempts is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: does-not-exist.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: TESTKEYID1
          api-private-key: not-a-real-key
          upload-attempts: "-3"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for negative upload-attempts"
            exit 1
          fi
          if [ -n "$BACKEND" ]; then
            echo "FAIL: upload-backend output should be empty"
            exit 1
          fi
          echo "PASS"
