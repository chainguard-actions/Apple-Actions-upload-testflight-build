name: Test transporter backend with custom executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: does-not-exist.pkg
          app-type: macos
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: TESTKEYID1
          api-private-key: not-a-real-key
          backend: transporter
          transporter-executable-path: /nonexistent/itms/bin/iTMSTransporter
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for transporter with nonexistent executable on Linux"
            exit 1
          fi
          echo "PASS"
