name: Test transporter-executable-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/fake-app.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: fake-key-id
          api-private-key: fake-private-key
          backend: transporter
          transporter-executable-path: /usr/local/itms/bin/iTMSTransporter
      - name: Assert action ran with transporter-executable-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOAD_BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $UPLOAD_BACKEND"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOAD_BACKEND" ]; then
              echo "FAIL: action succeeded but upload-backend output is empty"
              exit 1
            fi
            echo "PASS: got upload-backend='$UPLOAD_BACKEND'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Apple credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
