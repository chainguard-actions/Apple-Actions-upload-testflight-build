name: Test appletvos and visionos app-type inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with appletvos app-type (expected to fail on non-macOS)
        id: action-tvos
        uses: .
        with:
          app-path: /tmp/fake-app.ipa
          app-type: appletvos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake
            -----END PRIVATE KEY-----
        continue-on-error: true

      - name: Assert appletvos action failed (macOS required)
        env:
          OUTCOME: ${{ steps.action-tvos.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-macOS runner, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-macOS runner with appletvos app-type"

      - name: Run action with visionos app-type (expected to fail on non-macOS)
        id: action-visionos
        uses: .
        with:
          app-path: /tmp/fake-app.ipa
          app-type: visionos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake
            -----END PRIVATE KEY-----
        continue-on-error: true

      - name: Assert visionos action failed (macOS required)
        env:
          OUTCOME: ${{ steps.action-visionos.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-macOS runner, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-macOS runner with visionos app-type"
