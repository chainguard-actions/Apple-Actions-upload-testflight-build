name: Test invalid private key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake IPA file
        run: |
          echo "fake ipa content" > /tmp/fake.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/fake.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: this-is-not-a-valid-pem-key
          backend: appstore-api

      - name: Assert action failed due to invalid private key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid private key"
