name: Test appstore-api with metadata options fails on missing app/invalid key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: does-not-exist.ipa
          app-type: ios
          issuer-id: 00000000-0000-0000-0000-000000000000
          api-key-id: TESTKEYID1
          api-private-key: not-a-real-key
          backend: appstore-api
          release-notes: "Test release notes for this build"
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with nonexistent app and invalid key"
            exit 1
          fi
          echo "PASS"
