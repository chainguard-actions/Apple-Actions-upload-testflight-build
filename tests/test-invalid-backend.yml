name: Test invalid backend name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: fake-app.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: invalid-backend
      - name: Assert action failed with invalid backend error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid backend, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid backend"
