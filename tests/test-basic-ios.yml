name: Test basic iOS upload attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # This action requires real Apple credentials and an IPA file.
    # We test that the action initializes correctly and fails at the
    # API authentication stage (not at a setup/configuration stage).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/testapp
          echo "dummy ipa content" > /tmp/testapp/MyApp.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/MyApp.ipa
          app-type: ios
          issuer-id: 12345678-1234-1234-1234-123456789012
          api-key-id: ABCDEF1234
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqDmSfpQnoDd65yIMpdnMCKahRANCAAQRWxNda9dN9YFQZ9AQZV0/RNZS7TC
            HMFxMFMoNcy6c2uYxAqDmSfpQnoDd65yIMpdnMCKahRANCAAQRWxNd
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action ran (even if it failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an auth/API error,
          # not with a missing-input or configuration error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert upload-backend output is set
        env:
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "upload-backend: $BACKEND"
          # The backend output should be set to the configured backend value
          # when the action initializes successfully before making API calls.
          # If credentials are invalid, the output may be empty - that's acceptable.
          echo "PASS: upload-backend output checked (value: '$BACKEND')"
