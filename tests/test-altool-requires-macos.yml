name: Test altool backend requires macOS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/fake.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: altool
      - name: Assert action failed due to non-macOS platform
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when using altool on Linux, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when altool backend used on non-macOS runner"
