name: Test iOS app-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ios app-type (expected to fail on non-macOS)
        id: action-ios
        uses: .
        with:
          app-path: /tmp/fake-app.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake
            -----END PRIVATE KEY-----
        continue-on-error: true

      - name: Assert ios action failed (macOS required)
        env:
          OUTCOME: ${{ steps.action-ios.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-macOS runner, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-macOS runner with ios app-type"

      - name: Run action with macos app-type (expected to fail on non-macOS)
        id: action-macos
        uses: .
        with:
          app-path: /tmp/fake-app.pkg
          app-type: macos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake
            -----END PRIVATE KEY-----
        continue-on-error: true

      - name: Assert macos action failed (macOS required)
        env:
          OUTCOME: ${{ steps.action-macos.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-macOS runner, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-macOS runner with macos app-type"
