name: Test appstore-api backend rejects macos app-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/fake.pkg
          app-type: macos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: appstore-api
      - name: Assert action failed due to macos app-type with appstore-api backend
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when using appstore-api with macos app-type, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected macos app-type with appstore-api backend"
