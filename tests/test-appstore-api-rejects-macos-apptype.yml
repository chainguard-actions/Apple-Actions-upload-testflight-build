name: Test appstore-api backend rejects macos app-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy pkg file
        run: |
          mkdir -p /tmp/testapp
          echo "fake pkg content" > /tmp/testapp/app.pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/testapp/app.pkg
          app-type: macos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgfake
            -----END PRIVATE KEY-----
          backend: appstore-api

      - name: Assert action failed because appstore-api does not support macos app-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for appstore-api + macos app-type, but outcome was $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected appstore-api backend for macos app-type"
