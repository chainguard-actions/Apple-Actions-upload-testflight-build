name: Test transporter backend requires macOS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy ipa file
        run: touch /tmp/dummy.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/dummy.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: transporter

      - name: Assert action failed due to non-macOS runner
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail because transporter requires macOS"
            exit 1
          fi
          echo "PASS: action correctly failed on non-macOS runner"
