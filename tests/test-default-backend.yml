name: Test default backend is appstore-api
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake IPA file
        run: |
          echo "fake ipa content" > /tmp/fake.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/fake.ipa
          app-type: ios
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: this-is-not-a-valid-pem-key
          # backend not specified — should default to appstore-api

      - name: Assert action failed (not due to invalid backend selection)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (invalid credentials), but NOT because of
          # an invalid backend. The default backend (appstore-api) should be
          # accepted and the failure should be at the crypto/API level.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected (default backend accepted, failed on credentials)"
