name: Test with release notes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy IPA file
        run: |
          mkdir -p /tmp/test-app-notes
          echo "dummy" > /tmp/test-app-notes/dummy.txt
          cd /tmp/test-app-notes && zip -r /tmp/test-app-notes/TestApp.ipa dummy.txt

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: '/tmp/test-app-notes/TestApp.ipa'
          app-type: 'ios'
          issuer-id: 'invalid-issuer-id'
          api-key-id: 'INVALIDKEY'
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgInvalidKeyData
            InvalidKeyDataInvalidKeyDataInvalidKeyDataInv
            -----END PRIVATE KEY-----
          release-notes: 'Bug fixes and performance improvements'

      - name: Assert action handled release-notes input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not due to release-notes input
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials (release-notes input accepted)"
          else
            echo "PASS: action completed with outcome: $OUTCOME"
          fi
