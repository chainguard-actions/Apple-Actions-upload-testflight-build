name: Test upload with release notes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake IPA file
        run: |
          mkdir -p /tmp/test-app
          echo "fake ipa content" > /tmp/test-app/MyApp.ipa

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: /tmp/test-app/MyApp.ipa
          app-type: ios
          issuer-id: 12345678-1234-1234-1234-123456789012
          api-key-id: ABCDEF1234
          api-private-key: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hD2
            cV4nqaseQ8baDP3NLzvjZLeIfKChRANCAAQRWxNda2OR6E7zKlvAcJSNMp8IQKFJ
            -----END PRIVATE KEY-----
          release-notes: "Bug fixes and performance improvements"
          backend: appstore-api

      - name: Assert action ran and failed gracefully (with release notes)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOAD_BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $UPLOAD_BACKEND"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (release notes input accepted, credentials invalid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
