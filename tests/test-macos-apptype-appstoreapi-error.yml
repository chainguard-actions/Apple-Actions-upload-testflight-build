name: Test macOS app-type with appstore-api backend fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: fake-app.pkg
          app-type: macos
          issuer-id: fake-issuer-id
          api-key-id: FAKEKEYID
          api-private-key: fake-private-key
          backend: appstore-api
      - name: Assert action failed due to macos app-type with appstore-api
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using macos app-type with appstore-api backend, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for macos app-type with appstore-api backend"
