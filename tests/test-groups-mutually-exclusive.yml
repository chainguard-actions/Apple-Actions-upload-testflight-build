name: Test groups and groups-file are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare dummy app, groups file and stale private key
        run: |
          echo "dummy" > "$RUNNER_TEMP/app.ipa"
          printf '# testers\nInternal Testers\n' > "$RUNNER_TEMP/groups.txt"
          mkdir -p "$HOME/private_keys"
          echo "stale" > "$HOME/private_keys/AuthKey_STALE.p8"
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-path: ${{ runner.temp }}/app.ipa
          app-type: ios
          issuer-id: dummy-issuer
          api-key-id: DUMMYKEY
          api-private-key: dummy-private-key
          groups: Internal Testers
          groups-file: ${{ runner.temp }}/groups.txt
      - name: Assert action failed due to mutually exclusive inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BACKEND: ${{ steps.action.outputs.upload-backend }}
        run: |
          echo "outcome: $OUTCOME"
          echo "upload-backend: $BACKEND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both groups and groups-file are set"
            exit 1
          fi
          if [ -n "$BACKEND" ]; then
            echo "FAIL: upload-backend should be empty"
            exit 1
          fi
          if [ -e "$HOME/private_keys" ]; then
            echo "FAIL: private_keys directory was not cleaned up"
            exit 1
          fi
          echo "PASS"
